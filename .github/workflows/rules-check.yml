name: Rules check

# Runs in the public feedoff-rules repo (unlimited free Actions minutes). Checks that every CSS
# selector in rules.json still matches something on the live mobile sites. Logged-in pages use
# saved Playwright sessions stored as the FEEDOFF_STATE_* secrets.
on:
  schedule:
    - cron: "17 6 * * *"
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build and validate rules.json
        run: node build.mjs && git diff --exit-code rules.json
      - name: Install Playwright WebKit
        run: npm install && npx playwright install --with-deps webkit
      - name: Check selectors against the live sites
        env:
          FEEDOFF_STATE_INSTAGRAM: ${{ secrets.FEEDOFF_STATE_INSTAGRAM }}
          FEEDOFF_STATE_YOUTUBE: ${{ secrets.FEEDOFF_STATE_YOUTUBE }}
          FEEDOFF_STATE_X: ${{ secrets.FEEDOFF_STATE_X }}
          FEEDOFF_STATE_REDDIT: ${{ secrets.FEEDOFF_STATE_REDDIT }}
          FEEDOFF_STATE_LINKEDIN: ${{ secrets.FEEDOFF_STATE_LINKEDIN }}
        run: node scripts/check-selectors.mjs
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selector-report
          path: report/
      - name: Open an issue on failure
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const title = `Nightly rules check failed (${new Date().toISOString().slice(0,10)})`;
            const { data: open } = await github.rest.issues.listForRepo({ ...context.repo, state: 'open', labels: 'rules' });
            if (open.some(i => i.title.startsWith('Nightly rules check failed'))) return;
            await github.rest.issues.create({ ...context.repo, title, labels: ['rules'],
              body: `A toggle has no live selector. See the run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}` });
